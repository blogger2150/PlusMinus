<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlusMinus — Search</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="mark">+<i>−</i></span>PlusMinus</a>
  <nav><a class="active" href="index.html">Search</a></nav>
</header>

<main>
<section class="hero" id="hero">
  <div class="hero-mark">+ −</div><h1>PlusMinus</h1>
  <p>More useful. Less noise.</p>
  <form id="searchForm" class="searchbox">
    <input id="q" placeholder="Search the web..." autocomplete="off" aria-label="Search">
    <button type="submit">Search</button>
  </form>
  <div class="quick">
    <button type="button" data-q="technology">Technology</button>
    <button type="button" data-q="India">India</button>
    <button type="button" data-q="science">Science</button>
  </div>
</section>

<section id="results" class="results hidden">
  <form id="resultForm" class="searchbox">
    <input id="rq" autocomplete="off" aria-label="Search again"><button type="submit">Search</button>
  </form>
  <div class="tabs" role="tablist" aria-label="Search type">
    <button class="tab active" data-tab="all" type="button">All</button>
    <button class="tab" data-tab="news" type="button">News</button>
    <button class="tab" data-tab="images" type="button">Images</button>
    <button class="tab" data-tab="videos" type="button">Videos</button>
    <button class="tab" data-tab="maps" type="button">Maps</button>
  </div>
  <div id="meta"></div><div id="list"></div>
</section>
</main>
<footer>PlusMinus · Early search prototype</footer>
<script src="script.js"></script>
</body>
</html>

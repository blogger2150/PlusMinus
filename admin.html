<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlusMinus — Admin</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="mark">+<i>−</i></span>PlusMinus</a><nav><a href="index.html">Search</a><a class="active" href="admin.html">Admin</a></nav></header>
<main class="admin"><div class="adminhead"><div><span class="eyebrow">CONTROL CENTER</span><h1>Admin Console</h1><p>Review and control which websites can enter the PlusMinus index.</p></div><button id="addBtn" class="primary">+ Add Website</button></div>
<div class="stats"><div><small>Pending</small><strong id="pendingCount">0</strong></div><div><small>Approved</small><strong id="approvedCount">0</strong></div><div><small>Rejected</small><strong id="rejectedCount">0</strong></div></div>
<div class="panel"><div class="paneltop"><h2>Websites</h2><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="pending">Pending</button><button class="filter" data-filter="approved">Approved</button><button class="filter" data-filter="rejected">Rejected</button></div></div><div id="sites"></div></div></main>
<div id="modal" class="modal hidden"><div class="modalcard"><button class="close" id="close">×</button><h2>Add Website</h2><form id="siteForm"><label>Website name<input id="name" required placeholder="Example News"></label><label>Domain<input id="domain" required placeholder="example.com"></label><label>Category<select id="category"><option>General</option><option>Technology</option><option>News</option><option>Science</option><option>India</option></select></label><button class="primary">Submit for Review</button></form></div></div>
<script src="admin.js"></script></body></html>
